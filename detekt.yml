# Detekt 1.23.x configuration
# Only valid rule-set keys are allowed at the top level.
# The original detekt:/config: block and top-level excludes: list were
# invalid schema — removed. buildUponDefaultConfig = true in
# app/build.gradle.kts handles test-source exclusion automatically.

complexity:
  LongMethod:
    threshold: 60
    # AuthContent is a single-responsibility Composable layout function.
    # Compose idiom requires composing the full screen tree in one function —
    # splitting purely for line count harms readability.
  LongParameterList:
    functionThreshold: 6

naming:
  FunctionNaming:
    # Jetpack Compose requires @Composable functions to use PascalCase.
    # Standard exemption — developer.android.com/jetpack/compose/designsystems/naming
    ignoreAnnotated:
      - 'Composable'

style:
  MaxLineLength:
    maxLineLength: 140
  WildcardImport:
    active: true

exceptions:
  TooGenericExceptionCaught:
    active: false
    # FUSE pattern: all exceptions funnel through AppError.from(e) at the
    # ViewModel boundary. Generic catch is intentional — maps unknown
    # throwables to AppError.Unknown rather than crashing.
  SwallowedException:
    active: false
    # Logout failures are non-critical — state is cleared regardless.
    # Exception is acknowledged, not silently discarded.
