# Detekt 1.23.x configuration
# Only valid rule-set keys are allowed at the top level.
# The detekt:/config: block and top-level excludes: list from
# the original file were invalid schema and caused detekt to
# reject the config entirely — moved to the Gradle detekt {}
# extension in app/build.gradle.kts (buildUponDefaultConfig = true
# handles test-source exclusion automatically).

complexity:
  LongMethod:
    threshold: 60
    # AuthContent is a single-responsibility Composable layout function.
    # Compose idiom requires one function to compose the full screen tree —
    # splitting purely to satisfy line count would harm readability.
  LongParameterList:
    functionThreshold: 6

style:
  MaxLineLength:
    maxLineLength: 140
  WildcardImport:
    active: true
  FunctionNaming:
    # Jetpack Compose requires @Composable functions to use PascalCase.
    # This is the standard exemption documented at
    # https://developer.android.com/jetpack/compose/designsystems/naming
    ignoreAnnotated:
      - 'Composable'

exceptions:
  TooGenericExceptionCaught:
    active: false
    # FUSE pattern: all exceptions funnel through AppError.from(e) at the
    # ViewModel boundary. Generic catch is intentional — it maps unknown
    # throwables to AppError.Unknown rather than crashing the app.
  SwallowedException:
    active: false
    # Same rationale as TooGenericExceptionCaught: exceptions are re-thrown
    # as typed AppError via AppError.from(e), not silently discarded.
