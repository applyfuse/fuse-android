[versions]
agp                  = "8.5.2"
kotlin               = "2.0.21"
hilt                 = "2.52"
ksp                  = "2.0.21-1.0.28"
detekt               = "1.23.7"
compose-bom          = "2024.09.03"
lifecycle            = "2.8.6"
coroutines           = "1.9.0"
junit5               = "5.11.2"
junit-platform       = "1.11.2"
mockk                = "1.13.13"
truth                = "1.4.4"
okhttp               = "4.12.0"
serialization        = "1.7.3"
security-crypto      = "1.1.0-alpha06"

[libraries]
# Compose
compose-bom                     = { group = "androidx.compose",       name = "compose-bom",                    version.ref = "compose-bom" }
compose-ui                      = { group = "androidx.compose.ui",     name = "ui" }
compose-ui-tooling              = { group = "androidx.compose.ui",     name = "ui-tooling" }
compose-ui-tooling-preview      = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
compose-material3               = { group = "androidx.compose.material3", name = "material3" }
compose-icons-extended          = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose                = { group = "androidx.activity",       name = "activity-compose",               version = "1.9.3" }

# Lifecycle + ViewModel
lifecycle-viewmodel-compose     = { group = "androidx.lifecycle",      name = "lifecycle-viewmodel-compose",    version.ref = "lifecycle" }
lifecycle-runtime-compose       = { group = "androidx.lifecycle",      name = "lifecycle-runtime-compose",      version.ref = "lifecycle" }
lifecycle-viewmodel-ktx         = { group = "androidx.lifecycle",      name = "lifecycle-viewmodel-ktx",        version.ref = "lifecycle" }

# Coroutines
kotlinx-coroutines-android      = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-android",     version.ref = "coroutines" }
kotlinx-coroutines-test         = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-test",        version.ref = "coroutines" }

# Networking
okhttp                          = { group = "com.squareup.okhttp3",    name = "okhttp",                         version.ref = "okhttp" }
kotlinx-serialization-json      = { group = "org.jetbrains.kotlinx",   name = "kotlinx-serialization-json",     version.ref = "serialization" }

# Security
security-crypto                 = { group = "androidx.security",       name = "security-crypto",                version.ref = "security-crypto" }

# Hilt
hilt-android                    = { group = "com.google.dagger",       name = "hilt-android",                   version.ref = "hilt" }
hilt-compiler                   = { group = "com.google.dagger",       name = "hilt-android-compiler",          version.ref = "hilt" }
hilt-navigation-compose         = { group = "androidx.hilt",           name = "hilt-navigation-compose",        version = "1.2.0" }

# Testing
junit5-api                      = { group = "org.junit.jupiter",       name = "junit-jupiter-api",              version.ref = "junit5" }
junit5-engine                   = { group = "org.junit.jupiter",       name = "junit-jupiter-engine",           version.ref = "junit5" }
junit5-params                   = { group = "org.junit.jupiter",       name = "junit-jupiter-params",           version.ref = "junit5" }
# junit-platform-launcher is required for JUnit Platform to start the test runner on JVM.
# Without it, testDebugUnitTest reports 0 tests run (no error, silent failure).
junit-platform-launcher         = { group = "org.junit.platform",      name = "junit-platform-launcher",        version.ref = "junit-platform" }
mockk                           = { group = "io.mockk",                name = "mockk",                          version.ref = "mockk" }
truth                           = { group = "com.google.truth",        name = "truth",                          version.ref = "truth" }
# MockWebServer (OkHttp's own) — exercises LiveHttpClient against real HTTP
# so the status-code -> AppError mapping is actually tested, not assumed.
mockwebserver                   = { group = "com.squareup.okhttp3",    name = "mockwebserver",                  version.ref = "okhttp" }

# Detekt
detekt-formatting               = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting",          version.ref = "detekt" }

[plugins]
android-application             = { id = "com.android.application",            version.ref = "agp" }
kotlin-android                  = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose                  = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization            = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                            = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
ksp                             = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
detekt                          = { id = "io.gitlab.arturbosch.detekt",          version.ref = "detekt" }
